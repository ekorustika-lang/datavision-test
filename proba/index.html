<!DOCTYPE html>
<html lang="hr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataVision - proba</title>
<meta name="theme-color" content="#050B16">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg">
<link rel="stylesheet" href="../style.css">
<style>
.stage.has3d{position:relative}
.hfield{--amp:0;position:relative;width:min(88vw,340px);aspect-ratio:1;margin:0 auto;contain:layout paint}
.hfield>*{position:absolute;pointer-events:none}
.hcv{left:12%;top:12%;width:76%;height:76%;mix-blend-mode:screen;-webkit-mask-image:radial-gradient(ellipse 50% 54% at 50% 48%,#000 55%,rgba(0,0,0,.6) 72%,transparent 100%);mask-image:radial-gradient(ellipse 50% 54% at 50% 48%,#000 55%,rgba(0,0,0,.6) 72%,transparent 100%);filter:drop-shadow(0 0 10px rgba(70,229,255,.35))}
.hbreath{inset:6%;border-radius:50%;border:1.5px solid rgba(70,229,255,.55);background:radial-gradient(circle,rgba(8,125,250,.20) 30%,rgba(70,229,255,.06) 60%,transparent 72%);box-shadow:0 0 calc(18px + 30px*var(--amp)) rgba(70,229,255,calc(.35 + .4*var(--amp))),inset 0 0 30px rgba(8,125,250,.35);animation:hbr 4s ease-in-out infinite;will-change:transform,opacity}
@keyframes hbr{0%,100%{transform:scale(.97);opacity:.7;border-color:rgba(8,125,250,.6)}50%{transform:scale(1.03);opacity:1;border-color:rgba(70,229,255,.85)}}
.hring{inset:2%;width:96%;height:96%;fill:none;will-change:transform}
.hring ellipse{stroke-width:.35;vector-effect:non-scaling-stroke}
.r1 ellipse{stroke:rgba(70,229,255,.55);stroke-dasharray:40 12 4 12}
.r2 ellipse{stroke:rgba(57,255,20,.35);stroke-dasharray:6 18}
.r1{animation:hr1 26s linear infinite}.r2{animation:hr2 38s linear infinite}
@keyframes hr1{from{transform:perspective(600px) rotateX(68deg) rotateZ(0)}to{transform:perspective(600px) rotateX(68deg) rotateZ(360deg)}}
@keyframes hr2{from{transform:perspective(600px) rotateY(66deg) rotateZ(360deg)}to{transform:perspective(600px) rotateY(66deg) rotateZ(0)}}
.hwave{inset:10%;border-radius:50%;border:1px solid rgba(70,229,255,.4);animation:hwv 6s ease-out infinite;opacity:0}
.hwave.w2{animation-delay:3s}
@keyframes hwv{0%{transform:scale(.85);opacity:0}20%{opacity:.5}100%{transform:scale(1.12);opacity:0}}
.hp{left:50%;top:50%;width:3px;height:3px;margin:-1.5px;border-radius:50%;background:#46E5FF;box-shadow:0 0 6px #46E5FF;animation:hpa var(--d) linear infinite;animation-delay:var(--dl);opacity:0}
.hp:nth-of-type(3n){background:#39FF14;box-shadow:0 0 6px #39FF14}
@keyframes hpa{0%{transform:rotate(var(--a)) translateY(-34%) translateY(-90px);opacity:0}25%{opacity:.8}100%{transform:rotate(calc(var(--a) + 50deg)) translateY(-160px);opacity:0}}
#app.speaking .hbreath{animation-duration:2s}
@media (prefers-reduced-motion:reduce){.hfield *{animation:none!important}}
</style>
</head><body>
<canvas id="particles"></canvas>
<main id="app">
<h1>DATAVISION</h1>
<p class="sub">ONE MIND. EVERYWHERE.</p>
<span class="mode" id="mode">DEMO NAČIN RADA</span>
<div class="stage">
<svg viewBox="0 0 340 340" aria-label="Hologram asistenta Data">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39FF14" stop-opacity=".55"/><stop offset="1" stop-color="#1FBF0A" stop-opacity=".08"/></linearGradient>
<pattern id="lines" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="1.4" fill="#39FF14" opacity=".22"/></pattern>
<clipPath id="clip"><rect width="340" height="330"/></clipPath>
</defs>
<ellipse class="ring" cx="170" cy="300" rx="130" ry="18" fill="none" stroke="#1FBF0A" stroke-width="2" stroke-dasharray="14 8"/>
<ellipse cx="170" cy="300" rx="95" ry="11" fill="none" stroke="#39FF14" stroke-width="1.2" opacity=".6"/>
<g id="holo" clip-path="url(#clip)">
<path d="M40 300 C50 235 95 215 135 208 L150 190 L190 190 L205 208 C245 215 290 235 300 300 Z" fill="url(#g)" stroke="#39FF14" stroke-width="2"/>
<path d="M40 300 C50 235 95 215 135 208 L150 190 L190 190 L205 208 C245 215 290 235 300 300 Z" fill="url(#lines)"/>
<path d="M150 190 L150 165 M190 190 L190 165" stroke="#39FF14" stroke-width="2"/>
<path d="M120 245 L170 270 L220 245 M170 270 L170 300" stroke="#39FF14" stroke-width="1.2" fill="none" opacity=".7"/>
<ellipse cx="170" cy="112" rx="52" ry="64" fill="url(#g)" stroke="#39FF14" stroke-width="2"/>
<ellipse cx="170" cy="112" rx="52" ry="64" fill="url(#lines)"/>
<path d="M122 92 C130 50 210 50 218 92" fill="none" stroke="#39FF14" stroke-width="1.5" opacity=".8"/>
<ellipse class="eye" cx="150" cy="108" rx="9" ry="4.5" fill="#F5FAFF"/>
<ellipse class="eye" cx="190" cy="108" rx="9" ry="4.5" fill="#F5FAFF"/>
<path d="M170 115 L166 132 L172 133" fill="none" stroke="#39FF14" stroke-width="1.4"/>
<ellipse id="mouth" cx="170" cy="150" rx="13" ry="2.2" fill="#F5FAFF" style="transform-origin:170px 150px"/>
<rect class="scan" x="20" y="0" width="300" height="3" fill="#39FF14" opacity=".55"/>
</g></svg>
<div class="waves"><i></i><i style="animation-delay:.1s"></i><i style="animation-delay:.25s"></i><i style="animation-delay:.05s"></i><i style="animation-delay:.3s"></i><i style="animation-delay:.15s"></i><i style="animation-delay:.2s"></i></div>
</div>
<div class="status"><b></b><span id="status">Spreman</span></div>
<div class="btns"><button class="primary" id="start">Pokreni Datu</button><button id="mic">🎤 Razgovaraj</button></div>
<form id="f"><input id="q" placeholder="Pitaj Datu" autocomplete="off"><button>Pošalji</button></form>
<div id="chat"><div class="empty">Razgovor će se prikazati ovdje.</div></div>
<p class="slogan">„Jedan Data. Svugdje s tobom.”</p>
<button id="install">📲 Instaliraj na početni zaslon</button>
</main>
<footer>EKORUSTIKA DIGITALNI ALATI</footer>
<script src="../app.js"></script>
<script>window.__e3d=[];addEventListener('error',function(e){window.__e3d.push((e.message||'')+' '+(e.filename||'').split('/').pop());},true);
setTimeout(function(){var s=document.querySelector('.stage');if(s&&!s.classList.contains('has3d')){var p=document.createElement('div');p.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#300;color:#fdd;font:12px monospace;padding:8px;border-radius:8px';p.textContent='3D hologram nije učitan (PROBA): '+(window.__e3d.join(' | ')||'nema poruke o grešci');document.body.appendChild(p);}},6000);</script>
<script src="holo-img.js?v=p2"></script>
<div style="position:fixed;top:4px;right:6px;font:10px sans-serif;color:#46E5FF;opacity:.6;z-index:99">PROBA p2</div>
</body></html>
