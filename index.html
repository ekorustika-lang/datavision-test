<!DOCTYPE html>
<html lang="hr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataVision 1.0</title>
<meta name="theme-color" content="#050B16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="particles"></canvas>
<main id="app">
<h1>DATAVISION</h1>
<p class="sub">ONE MIND. EVERYWHERE.</p>
<span class="mode" id="mode">DEMO NAČIN RADA</span>
<div class="stage">
<svg viewBox="0 0 340 340" aria-label="Hologram asistenta Data">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46E5FF" stop-opacity=".55"/><stop offset="1" stop-color="#087DFA" stop-opacity=".08"/></linearGradient>
<pattern id="lines" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="1.4" fill="#46E5FF" opacity=".22"/></pattern>
<clipPath id="clip"><rect width="340" height="330"/></clipPath>
</defs>
<ellipse class="ring" cx="170" cy="300" rx="130" ry="18" fill="none" stroke="#087DFA" stroke-width="2" stroke-dasharray="14 8"/>
<ellipse cx="170" cy="300" rx="95" ry="11" fill="none" stroke="#46E5FF" stroke-width="1.2" opacity=".6"/>
<g id="holo" clip-path="url(#clip)">
<path d="M40 300 C50 235 95 215 135 208 L150 190 L190 190 L205 208 C245 215 290 235 300 300 Z" fill="url(#g)" stroke="#46E5FF" stroke-width="2"/>
<path d="M40 300 C50 235 95 215 135 208 L150 190 L190 190 L205 208 C245 215 290 235 300 300 Z" fill="url(#lines)"/>
<path d="M150 190 L150 165 M190 190 L190 165" stroke="#46E5FF" stroke-width="2"/>
<path d="M120 245 L170 270 L220 245 M170 270 L170 300" stroke="#46E5FF" stroke-width="1.2" fill="none" opacity=".7"/>
<ellipse cx="170" cy="112" rx="52" ry="64" fill="url(#g)" stroke="#46E5FF" stroke-width="2"/>
<ellipse cx="170" cy="112" rx="52" ry="64" fill="url(#lines)"/>
<path d="M122 92 C130 50 210 50 218 92" fill="none" stroke="#46E5FF" stroke-width="1.5" opacity=".8"/>
<ellipse class="eye" cx="150" cy="108" rx="9" ry="4.5" fill="#F5FAFF"/>
<ellipse class="eye" cx="190" cy="108" rx="9" ry="4.5" fill="#F5FAFF"/>
<path d="M170 115 L166 132 L172 133" fill="none" stroke="#46E5FF" stroke-width="1.4"/>
<ellipse id="mouth" cx="170" cy="150" rx="13" ry="2.2" fill="#F5FAFF" style="transform-origin:170px 150px"/>
<rect class="scan" x="20" y="0" width="300" height="3" fill="#46E5FF" opacity=".55"/>
</g></svg>
<div class="waves"><i></i><i style="animation-delay:.1s"></i><i style="animation-delay:.25s"></i><i style="animation-delay:.05s"></i><i style="animation-delay:.3s"></i><i style="animation-delay:.15s"></i><i style="animation-delay:.2s"></i></div>
</div>
<div class="status"><b></b><span id="status">Spreman</span></div>
<div class="btns"><button class="primary" id="start">Pokreni Datu</button><button id="mic">🎤 Razgovaraj</button></div>
<form id="f"><input id="q" placeholder="Pitaj Datu" autocomplete="off"><button>Pošalji</button></form>
<div id="chat"><div class="empty">Razgovor će se prikazati ovdje.</div></div>
<p class="slogan">„Jedan Data. Svugdje s tobom.”</p>
<button id="install">📲 Instaliraj na početni zaslon</button>
</main>
<footer>EKORUSTIKA DIGITALNI ALATI</footer>
<script src="app.js"></script>
</body></html>
